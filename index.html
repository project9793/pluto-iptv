<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FF7A18" />
<title>Pluto IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root{
    --accent:#FF7A18;
    --accent-2:#FF9A3D;
    --ink:#1E2530;
    --ink-soft:#6B7280;
    --line:#EDEFF3;
    --bg:#F4F5F8;
    --card:#FFFFFF;
    --green:#22C55E;
    --red:#EF4444;
    --radius:20px;
    --shadow:0 10px 30px rgba(24,32,48,.08);
    --shadow-sm:0 4px 14px rgba(24,32,48,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 50% -10%, #FFE9D6 0%, rgba(255,233,214,0) 60%),
      var(--bg);
    display:flex;justify-content:center;align-items:stretch;
    overflow:hidden;            /* page khud scroll na ho — sirf list scroll ho */
  }

  /* ---------- Phone shell (matches the reference mockup feel) ---------- */
  .phone{
    width:100%;
    max-width:460px;
    height:100%;                  /* html/body 100% — screen ki poori height */
    background:var(--bg);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:520px){
    body{padding:18px 0;}
    .phone{
      max-width:430px;
      border-radius:38px;
      box-shadow:0 30px 70px rgba(24,32,48,.22), 0 0 0 10px #14181f;
      border:1px solid #000;
    }
  }

  .app{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    background:var(--bg);
    transform:translateX(100%);
    opacity:0;pointer-events:none;
    transition:transform .32s cubic-bezier(.4,.1,.2,1), opacity .32s;
  }
  .screen.active{transform:translateX(0);opacity:1;pointer-events:auto;}
  /* transform:none — taaki andar ka fixed bottom-nav viewport ke hisaab se lage */
  #screenList{transform:none;opacity:1;pointer-events:auto;}
  #screenList.leave-left{transform:translateX(-24%);opacity:0;pointer-events:none;}

  /* ---------- Top header ---------- */
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 12px;
    gap:10px;
  }
  .greet .hello{font-size:12.5px;color:var(--ink-soft);letter-spacing:.2px;}
  .greet h1{margin:2px 0 0;font-size:24px;letter-spacing:-.4px;font-weight:800;}
  .greet h1 span{color:var(--accent);}
  .avatar{
    width:42px;height:42px;border-radius:14px;
    border:0;background:transparent;padding:0;overflow:hidden;
    display:grid;place-items:center;
    cursor:pointer;box-shadow:0 6px 16px rgba(255,122,24,.35);
  }
  .avatar svg{width:100%;height:100%;display:block;}
  .avatar:active{transform:scale(.95);}

  /* ---------- Splash screen (app logo) ---------- */
  .splash{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:120;
    background:linear-gradient(180deg,#FFFFFF 0%, #FFF1E2 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  .splash.hide{opacity:0;visibility:hidden;}
  .splash .splash-logo{width:108px;height:108px;filter:drop-shadow(0 14px 28px rgba(255,122,24,.38));animation:spPop .55s cubic-bezier(.2,.9,.3,1.3) both;}
  .splash .splash-name{font-size:25px;font-weight:800;letter-spacing:-.4px;color:var(--ink);}
  .splash .splash-name span{color:var(--accent);}
  @keyframes spPop{from{transform:scale(.82);}to{transform:none;}}

  /* ---------- Device / channel bar ---------- */
  .devicebar{
    margin:2px 14px 10px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 14px 12px;
  }
  .drow{display:flex;align-items:center;justify-content:space-between;}
  .drow strong{font-size:16px;font-weight:800;letter-spacing:-.2px;}
  .dicons{display:flex;align-items:center;gap:6px;}
  .iconbtn{
    width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
    background:#fff;display:grid;place-items:center;color:#4B5563;cursor:pointer;
    transition:.18s;
  }
  .iconbtn:active{transform:scale(.92);background:#F8FAFC;}
  .iconbtn.plus{
    background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 6px 16px rgba(255,122,24,.4);
  }
  .iconbtn.plus svg{stroke-width:2.6;}
  .iconbtn svg{width:17px;height:17px;}
  .idbar{
    margin-top:11px;background:#F3F4F7;border-radius:12px;
    padding:9px 12px;font-size:12.5px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-variant-numeric:tabular-nums;
  }
  .idbar b{color:#374151;font-weight:700;}
  .searchwrap{margin-top:11px;}
  .searchwrap input{
    width:100%;border:1px solid var(--line);background:#F8FAFC;border-radius:12px;
    padding:11px 13px;font-size:14px;outline:none;color:var(--ink);
  }
  .searchwrap input:focus{border-color:var(--accent);background:#fff;}

  /* ---------- Channel list ---------- */
  .list{
    flex:1;overflow-y:auto;padding:2px 14px 16px;
    display:flex;flex-direction:column;gap:14px;
    -webkit-overflow-scrolling:touch;
  }
  /* ---------- grid view (Device button se) ---------- */
  .list.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;align-items:start;grid-auto-rows:min-content;}
  .list.grid .card-head{padding:9px 10px 6px;}
  .list.grid .ch-name{font-size:12.5px;}
  .list.grid .ch-status{font-size:10.5px;}
  .list.grid .thumb{margin:0 9px;border-radius:12px;}
  .list.grid .card-foot{display:none;}
  .list.grid .iconbtn{width:28px;height:28px;border-radius:9px;}
  .list.grid .iconbtn svg{width:14px;height:14px;}
  .list::-webkit-scrollbar{width:0;}
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
    flex:0 0 auto;               /* never shrink — warna bahut channels par cards dab jaate hain */
    animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both;
  }
  /* animate only transform, never opacity — so a card can never get stuck invisible */
  @keyframes pop{from{transform:translateY(10px) scale(.985);}to{transform:none;}}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;}
  .ch-name{font-size:14.5px;font-weight:800;letter-spacing:-.2px;line-height:1.15;}
  .ch-status{font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15);}
  .dot.off{background:#9CA3AF;box-shadow:0 0 0 3px rgba(156,163,175,.15);}
  .card-tools{display:flex;gap:6px;}
  .thumb{
    position:relative;margin:0 12px;border-radius:16px;overflow:hidden;
    aspect-ratio:16/9;background:#0E1116;cursor:pointer;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#0E1116;}
  .thumb .ph{
    position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(135deg,#232a36,#0e1116);
    color:#fff;font-weight:800;font-size:26px;letter-spacing:1px;opacity:.9;
  }
  .thumb .ts{
    position:absolute;top:9px;right:9px;background:rgba(12,15,20,.55);
    color:#fff;font-size:10.5px;padding:3px 7px;border-radius:7px;
    backdrop-filter:blur(4px);font-variant-numeric:tabular-nums;
  }
  .thumb .badge{
    position:absolute;top:9px;left:9px;background:rgba(12,15,20,.55);
    color:#fff;font-size:10px;padding:3px 8px;border-radius:7px;
    display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px);
    text-transform:uppercase;letter-spacing:.4px;
  }
  .thumb .play{
    position:absolute;right:10px;bottom:10px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,122,24,.94);display:grid;place-items:center;
    color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:.18s;
  }
  .thumb:hover .play{transform:scale(1.08);}
  .thumb .cam{
    position:absolute;right:58px;bottom:14px;color:#fff;opacity:.85;
  }
  .card-foot{
    margin:11px 12px 12px;background:#F3F4F7;border-radius:12px;
    padding:8px 12px;font-size:11.5px;color:var(--ink-soft);
    display:flex;justify-content:space-between;gap:8px;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
  }

  .empty{
    margin:26px 20px;text-align:center;color:var(--ink-soft);
    display:none;flex-direction:column;align-items:center;gap:10px;
  }
  .empty.show{display:flex;}
  .empty .ic{width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);color:var(--accent);}
  .empty h3{margin:4px 0 0;color:var(--ink);font-size:16px;}
  .empty p{margin:0;font-size:13px;line-height:1.5;}

  /* ---------- Bottom nav ---------- */
  /* nav ab layout ka normal hissa hai (floating nahi) — isliye content kabhi iske neeche nahi jayega */
  .bottomnav{
    flex:0 0 auto;
    margin:10px 14px 0;
    background:#fff;border-radius:22px;box-shadow:0 14px 34px rgba(24,32,48,.16);
    display:flex;align-items:center;justify-content:space-around;
    padding:9px 8px;z-index:6;
  }
  .navitem{
    border:0;background:transparent;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:#9AA1AC;font-size:10.5px;font-weight:700;
    padding:6px 12px;border-radius:14px;cursor:pointer;transition:.18s;
  }
  .navitem svg{width:20px;height:20px;}
  .navitem.active{color:var(--accent);background:#FFF3E8;}
  .navitem.orange{color:#fff;background:var(--accent);box-shadow:0 6px 16px rgba(255,122,24,.4);}

  /* ---------- Player screen ---------- */
  .player-top{
    padding:14px 14px 12px;background:transparent;
  }
  .player-top .back{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);
  }
  .player-top .ptitle{
    flex:1;text-align:center;font-weight:800;font-size:13px;
    letter-spacing:1.2px;text-transform:uppercase;color:#3A4250;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;
  }
  .stage{
    position:relative;margin:0 12px;border-radius:18px;overflow:hidden;
    background:#0B0E13;aspect-ratio:16/9;box-shadow:var(--shadow);
  }
  .stage:fullscreen{border-radius:0;margin:0;aspect-ratio:auto;width:100%;height:100%;}
  .stage video{width:100%;height:100%;object-fit:contain;display:block;background:#0B0E13;}
  .ovl{position:absolute;color:#fff;font-size:11.5px;font-variant-numeric:tabular-nums;
       text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none;}
  .ovl.speed{right:11px;bottom:11px;}
  .ovl.index{left:50%;transform:translateX(-50%);bottom:11px;letter-spacing:.5px;}
  .ovl.rec{
    left:11px;top:11px;background:rgba(239,68,68,.92);border-radius:8px;
    padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.6px;
    display:flex;align-items:center;gap:6px;
  }
  .ovl.rec .blink{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .ovl.err{
    left:12px;right:12px;bottom:12px;background:rgba(239,68,68,.9);
    padding:8px 11px;border-radius:10px;font-size:12px;text-align:center;
    pointer-events:none;
  }
  .gridview{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,10,14,.985);
    padding:12px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);
    gap:10px;align-content:start;align-items:start;z-index:60;
  }
  .gridview .gitem{
    position:relative;border-radius:10px;overflow:hidden;
    height:0;padding-bottom:62.5%;        /* 16:10 — sab browsers me theek chalta hai */
    background:#1a1f28;cursor:pointer;border:2px solid transparent;
  }
  .gridview .gitem.cur{border-color:var(--accent);}
  .gridview .gitem img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0E1116;
  }
  .gridview .gph{
    position:absolute;inset:0;display:grid;place-items:center;
    background:linear-gradient(135deg,#232a36,#0e1116);color:#fff;font-weight:800;font-size:19px;
  }
  .gridview .gitem span{
    position:absolute;left:0;right:0;bottom:0;font-size:9.5px;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.85));padding:10px 5px 4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;
    margin:12px 12px 0;background:#2A303A;border-radius:14px;padding:7px 8px;
  }
  .toolbar button{
    border:0;background:transparent;color:#E5E7EB;cursor:pointer;
    width:38px;height:34px;border-radius:9px;display:grid;place-items:center;
    font-size:11px;font-weight:800;letter-spacing:.5px;transition:.16s;
  }
  .toolbar button svg{width:18px;height:18px;}
  .toolbar button:active{background:#3A4250;}
  .toolbar button.on{background:var(--accent);color:#fff;}
  .toolbar .recbtn.on{background:var(--red);}

  .quick{
    display:flex;justify-content:space-around;align-items:center;
    margin:16px 12px 0;padding:14px 10px;background:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
  }
  .quick button{
    border:0;background:transparent;display:flex;flex-direction:column;
    align-items:center;gap:7px;font-size:11px;font-weight:700;color:#4B5563;cursor:pointer;
  }
  .quick .circle{
    width:48px;height:48px;border-radius:50%;background:#FFF3E8;color:var(--accent);
    display:grid;place-items:center;transition:.18s;
  }
  .quick button:active .circle{transform:scale(.93);}
  .quick button.on .circle{background:var(--accent);color:#fff;}
  .quick svg{width:21px;height:21px;}

  .playerfoot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:14px 12px 14px;
  }
  .playerfoot .footright{display:flex;align-items:center;gap:7px;}
  .pill{
    border:1px solid var(--line);background:#fff;border-radius:12px;
    padding:10px 12px;font-size:12px;font-weight:800;color:#4B5563;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:.18s;
  }
  .pill:active{transform:scale(.96);}
  .pill.on{background:#FFF3E8;border-color:#FFD9B8;color:var(--accent);}
  .pill.feature{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 8px 20px rgba(255,122,24,.4);}
  .pill svg{width:16px;height:16px;}
  .navarrow{border:1px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;
    display:grid;place-items:center;cursor:pointer;color:#4B5563;}
  .navarrow:active{transform:scale(.94);}

  /* ---------- Sheets ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(15,19,26,.45);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:.25s;z-index:40;
  }
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
    width:100%;max-width:460px;background:#fff;
    border-radius:26px 26px 0 0;padding:8px 18px 24px;
    box-shadow:0 -20px 50px rgba(0,0,0,.25);
    transition:transform .34s cubic-bezier(.2,.9,.25,1);z-index:41;
    max-height:92dvh;overflow-y:auto;
  }
  .sheet.show{transform:translate(-50%,0);}
  .grab{width:44px;height:5px;border-radius:5px;background:#E1E4EA;margin:8px auto 12px;}
  .sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.3px;}
  .sheet .sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-soft);}
  .tabs{display:flex;background:#F3F4F7;border-radius:13px;padding:4px;margin-bottom:16px;}
  .tabs button{
    flex:1;border:0;background:transparent;padding:10px;border-radius:10px;
    font-size:12.5px;font-weight:800;color:var(--ink-soft);cursor:pointer;transition:.18s;
  }
  .tabs button.active{background:#fff;color:var(--accent);box-shadow:var(--shadow-sm);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:#4B5563;margin-bottom:6px;}
  .field input,.field textarea{
    width:100%;border:1px solid var(--line);background:#F8FAFC;border-radius:13px;
    padding:12px 13px;font-size:14px;outline:none;color:var(--ink);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:78px;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff;}
  .input-row{display:flex;gap:8px;align-items:stretch;}
  .input-row input{flex:1;min-width:0;}
  .pastebtn{
    flex:none;display:flex;align-items:center;gap:6px;
    border:1px solid #FFD9B8;background:#FFF3E8;color:var(--accent);
    border-radius:13px;padding:0 14px;font-size:13px;font-weight:800;
    cursor:pointer;transition:.16s;font-family:inherit;
  }
  .pastebtn:active{transform:scale(.96);}
  .pastebtn svg{width:15px;height:15px;}
  .logo-preview{
    display:flex;align-items:center;gap:12px;background:#F8FAFC;border:1px dashed #D8DDE6;
    border-radius:14px;padding:10px;margin-bottom:13px;
  }
  .logo-preview .box{
    width:64px;height:40px;border-radius:9px;overflow:hidden;background:#0E1116;
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none;
  }
  .logo-preview .box img{width:100%;height:100%;object-fit:contain;}
  .logo-preview .meta{font-size:11.5px;color:var(--ink-soft);line-height:1.45;overflow:hidden;}
  .btn{
    width:100%;border:0;border-radius:14px;padding:14px;font-size:14.5px;font-weight:800;
    background:var(--accent);color:#fff;cursor:pointer;letter-spacing:.2px;
    box-shadow:0 10px 24px rgba(255,122,24,.35);transition:.18s;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#F3F4F7;color:#4B5563;box-shadow:none;margin-top:9px;}
  .btn.danger{background:#FEF2F2;color:var(--red);box-shadow:none;}
  .hint{font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.5;}
  .menu-item{
    display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:14px;font-weight:700;color:#374151;
  }
  .menu-item:last-child{border-bottom:0;}
  .menu-item .mi-ic{width:36px;height:36px;border-radius:11px;background:#FFF3E8;color:var(--accent);
    display:grid;place-items:center;flex:none;}
  .menu-item.danger{color:var(--red);}
  .menu-item.danger .mi-ic{background:#FEF2F2;color:var(--red);}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;}
  .row-between .rt{font-size:13.5px;font-weight:700;}
  .row-between .rs{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .switch{width:46px;height:27px;border-radius:20px;background:#DDE1E8;position:relative;cursor:pointer;flex:none;transition:.2s;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .switch.on{background:var(--accent);}
  .switch.on::after{left:22px;}

  /* gallery */
  .gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .gal-item{border-radius:14px;overflow:hidden;background:#0E1116;position:relative;cursor:pointer;}
  .gal-item img,.gal-item video{width:100%;height:100%;object-fit:cover;aspect-ratio:16/10;display:block;}
  .gal-item span{position:absolute;left:0;right:0;bottom:0;color:#fff;font-size:10px;
    padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.8));
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);
    background:#1E2530;color:#fff;padding:11px 18px;border-radius:13px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;
    max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="splash" id="splash">
  <svg class="splash-logo" viewBox="0 0 64 64" aria-label="Pluto IPTV logo">
    <defs><linearGradient id="lgS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A3D"/><stop offset="1" stop-color="#FF6A00"/></linearGradient></defs>
    <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#lgS)"/>
    <path d="M26 20.5 45 32 26 43.5z" fill="#fff"/>
  </svg>
  <div class="splash-name">Pluto <span>IPTV</span></div>
</div>
<div class="phone">
  <div class="app">

    <!-- ============ SCREEN 1 : CHANNEL LIST ============ -->
    <section class="screen" id="screenList">
      <header class="top">
        <div class="greet">
          <span class="hello">Hello</span>
          <h1>Pluto <span>IPTV</span></h1>
        </div>
        <button class="avatar" id="profileBtn" title="Pluto IPTV">
          <svg viewBox="0 0 64 64" aria-label="Pluto IPTV">
            <defs><linearGradient id="lgH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A3D"/><stop offset="1" stop-color="#FF6A00"/></linearGradient></defs>
            <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#lgH)"/>
            <path d="M26 20.5 45 32 26 43.5z" fill="#fff"/>
          </svg>
        </button>
      </header>

      <div class="devicebar">
        <div class="drow">
          <strong>Channels</strong>
          <div class="dicons">
            <button class="iconbtn" id="searchBtn" title="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2" stroke-linecap="round"/></svg>
            </button>
            <button class="iconbtn plus" id="plusBtn" title="Add channel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="idbar">
          <span id="idbarText">Total: <b>0</b> channels</span>
          <span id="idbarPlaylist">No playlist</span>
        </div>
        <div class="searchwrap" id="searchWrap" hidden>
          <input id="searchInput" placeholder="Search channel name or group..." />
        </div>
      </div>

      <div class="list" id="channelList"></div>

      <div class="empty show" id="emptyState">
        <div class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="30" height="30">
            <rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <h3>No channels yet</h3>
        <p>Tap the <b>+</b> button above to add a single channel, or load a whole <b>M3U playlist</b> in one go.</p>
      </div>

      <nav class="bottomnav">
        <button class="navitem active" data-nav="device">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2.5" y="6" width="14" height="12" rx="3"/><path d="m16.5 10 5-3v10l-5-3z" stroke-linejoin="round"/></svg>
          Device
        </button>
        <button class="navitem orange" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14.2 2h-4l-.3 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4z" stroke-linejoin="round"/></svg>
          Settings
        </button>
        <button class="navitem" data-nav="media">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5L10 15.5z" fill="currentColor" stroke="none"/></svg>
          Media
        </button>
        <button class="navitem" data-nav="fav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3.6l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.8l5.9-.9z" stroke-linejoin="round"/></svg>
          Favourite
        </button>
      </nav>
    </section>

    <!-- ============ SCREEN 2 : PLAYER ============ -->
    <section class="screen" id="screenPlayer">
      <header class="top player-top">
        <button class="back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="19" height="19"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="ptitle" id="playerTitle">PLUTO IPTV</span>
        <button class="back" id="gearBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="19" height="19"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14.2 2h-4l-.3 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4z" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="stage" id="stage">
        <video id="video" playsinline autoplay muted></video>
        <div class="gridview" id="gridView" hidden></div>
        <div class="ovl rec" id="recBadge" hidden><span class="blink"></span><span id="recTime">REC 00:00</span></div>
        <div class="ovl err" id="errBox" hidden></div>
        <div class="ovl speed" id="speedLabel">— KB/S</div>
        <div class="ovl index" id="indexLabel">0/0</div>
      </div>

      <div class="toolbar">
        <button id="gridBtn" title="Grid view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.4"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.4"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.4"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.4"/></svg>
        </button>
        <button id="sdBtn" title="Quality">SD</button>
        <button id="volBtn" title="Mute / Unmute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke-linecap="round"/></svg>
        </button>
        <button id="snapBtn" title="Snapshot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4"/></svg>
        </button>
        <button id="recBtn" class="recbtn" title="Record">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="6.5" width="12" height="11" rx="2.5"/><path d="m15 10.5 5-3v9l-5-3z" stroke-linejoin="round"/></svg>
        </button>
        <button id="fsBtn" title="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="quick">
        <button id="playbackBtn">
          <span class="circle"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5z"/></svg></span>
          Play
        </button>
        <button id="micBtn">
          <span class="circle"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.6" y="5" width="4" height="14" rx="1.3"/><rect x="13.4" y="5" width="4" height="14" rx="1.3"/></svg></span>
          Pause
        </button>
        <button id="galleryBtn">
          <span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.7"/><path d="m4 17 5-4.5 3.5 3L16 12l4 4" stroke-linejoin="round"/></svg></span>
          Gallery
        </button>
      </div>

      <div class="playerfoot">
        <button class="pill" id="autoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 1 2.3 5.6" stroke-linecap="round"/><path d="M4 20v-4h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="autoLabel">Auto: Off</span>
        </button>
        <div class="footright">
          <button class="navarrow" id="prevBtn" title="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="17" height="17"><path d="M17 6v12L9 12zM7 6v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="navarrow" id="nextBtn" title="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="17" height="17"><path d="M7 6v12l8-6zM17 6v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="pill feature" id="featureBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>
            Feature
          </button>
        </div>
      </div>
    </section>

  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   Pluto IPTV  —  single-file IPTV / CCTV viewer
   Screen 1: add channels (+ / playlist) & browse thumbnails
   Screen 2: play channel, live data-speed readout, record video, auto-play
   one-by-one through the whole playlist.
   ========================================================================= */
(function(){
  "use strict";

  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  const LS = {
    channels : "pluto.channels",
    playlist : "pluto.playlist",
    prefs    : "pluto.prefs"
  };

  /* ---------------- state ---------------- */
  let channels  = [];
  let playlistUrl = "";
  let current   = 0;
  let hls       = null;
  let recording = false, recStart = 0, recTimer = null, mediaRec = null, recChunks = [];
  let dwellTimer = null;
  let gallery   = [];               // {name, url, kind:'video'|'image', at}
  let prefs     = { auto:false, dwell:20, shuffle:false, quality:"SD", view:"list", favOnly:false };
  let searchTerm = "";

  const video = $("#video");

  /* ---------------- storage ---------------- */
  function load(){
    try{ channels = JSON.parse(localStorage.getItem(LS.channels)||"[]") || []; }catch(e){ channels=[]; }
    playlistUrl = localStorage.getItem(LS.playlist) || "";
    try{ prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(LS.prefs)||"{}")); }catch(e){}
  }
  function save(){
    localStorage.setItem(LS.channels, JSON.stringify(channels));
    localStorage.setItem(LS.playlist, playlistUrl);
    localStorage.setItem(LS.prefs, JSON.stringify(prefs));
  }

  /* ---------------- helpers ---------------- */
  const uid = () => "ch_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
  }
  const initial = n => (n||"?").trim().charAt(0).toUpperCase() || "?";
  function fmtClock(d){
    const p=n=>String(n).padStart(2,"0");
    return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }
  function shortId(s){ return (s||"").replace(/[^a-zA-Z0-9]/g,"").slice(0,18).toUpperCase() || "PLUTO-CH"; }
  function fmtSize(b){ if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(0)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
  function fmtDur(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }

  /* =========================================================
     SCREEN 1 — render the channel list
     ========================================================= */
  const listEl   = $("#channelList");
  const emptyEl  = $("#emptyState");

  function renderList(){
    listEl.classList.toggle("grid", prefs.view==="grid");
    const q = searchTerm.trim().toLowerCase();
    const items = channels.map((c,i)=>({c,i})).filter(({c})=>
      (!prefs.favOnly || c.fav) &&
      (!q || (c.name||"").toLowerCase().includes(q) || (c.group||"").toLowerCase().includes(q))
    );

    $("#idbarText").innerHTML = "Total: <b>"+channels.length+"</b> channels";
    $("#idbarPlaylist").textContent = prefs.favOnly ? "Favourites" : (playlistUrl ? "Playlist loaded" : "No playlist");
    const favNav = document.querySelector('.navitem[data-nav="fav"]');
    if(favNav) favNav.classList.toggle("active", !!prefs.favOnly);

    listEl.innerHTML = "";
    if(prefs.favOnly && !items.length && channels.length){
      listEl.innerHTML = '<div style="padding:26px 14px;text-align:center;color:#6B7280;font-size:13px;line-height:1.6">Abhi koi favourite channel nahi hai.<br>Kisi channel ke gear (&#9881;) par tap karke <b>Add to Favourite</b> chuno.</div>';
      return;
    }
    emptyEl.classList.toggle("show", channels.length===0);

    const frag = document.createDocumentFragment();
    items.forEach(({c,i})=>{
      try{
      const card = document.createElement("div");
      card.className = "card";
      const logo = c.logo
        ? '<img src="'+esc(c.logo)+'" alt="" loading="lazy" decoding="async" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.ph\').style.display=\'grid\'">'
        : '';
      card.innerHTML =
        '<div class="card-head">'+
          '<div>'+
            '<div class="ch-name">'+esc(c.name||"Unnamed channel")+'</div>'+
            '<div class="ch-status"><span class="dot"></span>'+(c.group? esc(c.group) : "Live stream")+'</div>'+
          '</div>'+
          '<div class="card-tools">'+
            '<button class="iconbtn js-gear" title="Options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="16" height="16"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14.2 2h-4l-.3 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4z" stroke-linejoin="round"/></svg></button>'+
          '</div>'+
        '</div>'+
        '<div class="thumb js-play" data-i="'+i+'">'+
          (logo ? logo : '')+
          '<div class="ph" style="display:'+(c.logo?'none':'grid')+'">'+esc(initial(c.name))+'</div>'+
          '<div class="badge"><span class="dot"></span>Live</div>'+
          '<span class="play"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M8 5.5v13l10-6.5z"/></svg></span>'+
        '</div>'+
        '<div class="card-foot">'+
          '<span>ID: '+shortId(c.id)+'</span>'+
          '<span>'+(c.group? esc(c.group).slice(0,14) : "ONLINE")+'</span>'+
        '</div>';

      card.querySelector(".js-play").addEventListener("click", ()=>openPlayer(i));
      card.querySelector(".js-gear").addEventListener("click", e=>{ e.stopPropagation(); channelMenu(i); });
      frag.appendChild(card);
      }catch(err){ /* ek kharab channel poori list ko blank na kar de */ }
    });
    listEl.appendChild(frag);
    if(items.length && !listEl.children.length){
      listEl.innerHTML = '<div style="padding:22px 14px;text-align:center;color:#EF4444;font-size:13px;line-height:1.5">Channels dikha nahi paye. Page ko refresh karke dobara try karo.</div>';
    }
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

  /* =========================================================
     SHEET system
     ========================================================= */
  const sheet = $("#sheet"), scrim = $("#scrim");
  function openSheet(html){
    sheet.innerHTML = '<div class="grab"></div>' + html;
    sheet.classList.add("show"); scrim.classList.add("show");
  }
  function closeSheet(){ sheet.classList.remove("show"); scrim.classList.remove("show"); }
  scrim.addEventListener("click", closeSheet);

  /* ---------- ADD sheet (single channel + playlist tabs) ---------- */
  function openAddSheet(tab){
    const wantPl = (tab==="pl" || tab==="playlist");
    openSheet(
      '<h2>Add to Pluto IPTV</h2>'+
      '<p class="sub">Add one channel at a time, or import a full M3U playlist.</p>'+
      '<div class="tabs">'+
        '<button class="'+(wantPl?"":"active")+'" data-tab="single">Single channel</button>'+
        '<button class="'+(wantPl?"active":"")+'" data-tab="playlist">Playlist URL</button>'+
      '</div>'+
      '<div id="tabBody"></div>'
    );
    const body = $("#tabBody");
    const paint = t => {
      const isPl = (t==="playlist" || t==="pl");
      body.innerHTML = isPl ? playlistForm() : singleForm();
      wireForm(isPl ? "playlist" : "single");
    };
    $$(".tabs button", sheet).forEach(b=>b.addEventListener("click",()=>{
      $$(".tabs button", sheet).forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); paint(b.dataset.tab);
    }));
    paint(wantPl ? "playlist" : "single");
  }

  function singleForm(){
    return ''+
      '<div class="field"><label>Channel name</label>'+
        '<input id="fName" placeholder="e.g. Front Gate Camera" autocomplete="off"></div>'+
      '<div class="field"><label>Channel logo URL <span style="font-weight:400;color:#9AA1AC">(optional)</span></label>'+
        '<input id="fLogo" placeholder="https://.../logo.png" autocomplete="off"></div>'+
      '<div class="logo-preview"><div class="box" id="logoBox">?</div>'+
        '<div class="meta" id="logoMeta">Logo preview will appear here.</div></div>'+
      '<div class="field"><label>Channel URL <span style="font-weight:400;color:#9AA1AC">(m3u8 / mp4 / rtsp via proxy)</span></label>'+
        '<input id="fUrl" placeholder="https://.../stream.m3u8" autocomplete="off"></div>'+
      '<button class="btn" id="fSubmit">Submit &amp; add channel</button>'+
      '<button class="btn ghost" id="fDemo">Load demo channels</button>'+
      '<p class="hint">Supports HLS (.m3u8) and progressive (.mp4) streams. For CCTV cameras, use an HLS/WebRTC bridge URL that the browser can reach.</p>';
  }
  function playlistForm(){
    return ''+
      '<div class="field"><label>Playlist URL (.m3u / .m3u8)</label>'+
        '<div class="input-row">'+
          '<input id="pUrl" placeholder="https://.../playlist.m3u" value="'+esc(playlistUrl)+'" autocomplete="off">'+
          '<button type="button" class="pastebtn" id="pUrlPaste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke-linecap="round"/></svg>Paste</button>'+
        '</div></div>'+
      '<button class="btn" id="pSubmit">Load playlist</button>'+
      '<p class="hint" id="plStatus" style="display:none;margin-top:10px"></p>'+
      '<button class="btn ghost" id="pPaste">Paste playlist text instead</button>'+
      '<div class="field" id="pPasteWrap" style="display:none;margin-top:14px"><label>Playlist text</label>'+
        '<textarea id="pText" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;...&quot; ,Channel Name&#10;https://.../stream.m3u8"></textarea></div>'+
      '<button type="button" class="btn ghost" id="pTextPaste" style="display:none">Paste from clipboard</button>'+
      '<button class="btn" id="pTextSubmit" style="display:none">Import pasted playlist</button>'+
      '<p class="hint">URL box ke saath <b>Paste</b> button dabao (clipboard se seedha paste ho jayega), phir <b>Load playlist</b> — saare channels ek saath aa jayenge.</p>';
  }

  function wireForm(t){
    if(t==="single"){
      const logoIn=$("#fLogo"), box=$("#logoBox"), meta=$("#logoMeta");
      const upd=()=>{ const v=logoIn.value.trim();
        box.innerHTML = v? '<img src="'+esc(v)+'" onerror="this.remove()">' : "?";
        meta.textContent = v || "Logo preview will appear here."; };
      logoIn.addEventListener("input", upd);
      $("#fName").addEventListener("input", e=>{ if(!logoIn.value.trim()) box.textContent = initial(e.target.value); });
      $("#fSubmit").addEventListener("click", addSingle);
      $("#fDemo").addEventListener("click", loadDemo);
    } else {
      $("#pSubmit").addEventListener("click", ()=>loadPlaylistFromUrl($("#pUrl").value.trim()));
      $("#pUrlPaste").addEventListener("click", ()=>pasteInto($("#pUrl")));
      $("#pPaste").addEventListener("click", ()=>{
        const w=$("#pPasteWrap"), b=$("#pTextSubmit"), c=$("#pTextPaste");
        const show = w.style.display==="none";
        w.style.display = show?"block":"none";
        b.style.display = show?"block":"none";
        c.style.display = show?"block":"none";
      });
      $("#pTextPaste").addEventListener("click", ()=>pasteInto($("#pText")));
      $("#pTextSubmit").addEventListener("click", ()=>importPlaylistText($("#pText").value, "pasted playlist"));
    }
  }

  /* ---------- add single channel ---------- */
  function addSingle(){
    const name=$("#fName").value.trim(), logo=$("#fLogo").value.trim(), url=$("#fUrl").value.trim();

  /* ---------- M3U parsing ---------- */
  function parseM3U(text){
    const out=[]; let meta=null;
    text.split(/\r?\n/).forEach(raw=>{
      const line=raw.trim(); if(!line) return;
      if(line[0]==="#"){
        if(/^#EXTINF/i.test(line)){
          const name=(line.split(",").pop()||"").trim();
          const logo=(line.match(/tvg-logo="([^"]*)"/i)||[])[1]||"";
          const group=(line.match(/group-title="([^"]*)"/i)||[])[1]||"";
          meta={name,logo,group};
        }
        return;
      }
      out.push({
        id:uid(),
        name:(meta&&meta.name)||line.split("/").pop()||"Channel",
        logo:(meta&&meta.logo)||"",
        group:(meta&&meta.group)||"",
        url:line
      });
      meta=null;
    });
    return out;
  }

  function importPlaylistText(text, label){
    const items=parseM3U(text||"");
    if(!items.length){ toast("No channels found in playlist"); return; }
    channels = channels.concat(items);
    save(); renderList(); closeSheet();
    toast(items.length+" channels imported from "+label);
  }

  function setPlStatus(msg, isErr){
    const el=$("#plStatus"); if(!el) return;
    if(!msg){ el.style.display="none"; el.textContent=""; return; }
    el.style.display="block";
    el.style.color = isErr ? "#EF4444" : "#6B7280";
    el.innerHTML = msg;
  }
  async function loadPlaylistFromUrl(url){
    if(!url){ toast("Pehle playlist URL daalo (ya Paste button dabao)"); setPlStatus("URL khali hai — pehle playlist URL daalo.", true); return; }
    const btn=$("#pSubmit");
    if(btn){ btn.disabled=true; btn.textContent="Loading…"; }
    setPlStatus("Playlist fetch ho rahi hai…");
    try{
      const res = await fetch(url, { mode:"cors" });
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      if(!/#EXT/i.test(text)) throw new Error("playlist format galat hai");
      playlistUrl = url;
      setPlStatus("");
      importPlaylistText(text, "playlist URL");
    }catch(err){
      const msg = (err && err.message) ? err.message : "network/CORS error";
      setPlStatus("Load nahi hua ("+esc(msg)+"). Internet/CORS check karo — ya neeche paste box me playlist text daal ke import karo.", true);
      toast("Playlist load nahi hua — "+msg);
      $("#pPasteWrap") && ($("#pPasteWrap").style.display="block");
      $("#pTextPaste") && ($("#pTextPaste").style.display="block");
      $("#pTextSubmit") && ($("#pTextSubmit").style.display="block");
    }finally{
      if(btn){ btn.disabled=false; btn.textContent="Load playlist"; }
    }
  }

  function pasteInto(input){
    const apply = txt=>{
      const t=(txt||"").trim();
      if(t) input.value = t;
      input.focus();
      toast(t ? "Pasted" : "Clipboard khali hai");
    };
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(apply).catch(()=>{
        input.focus();
        toast("Paste blocked — box me long-press karke Paste chuno");
      });
    }else{
      input.focus();
      toast("Box me long-press karke Paste chuno");
    }
  }

  /* =========================================================
     SCREEN 2 — player
     ========================================================= */
  const screenList=$("#screenList"), screenPlayer=$("#screenPlayer");

  function openPlayer(i){
    if(!channels.length){ toast("Add a channel first"); return; }
    current = Math.max(0, Math.min(i, channels.length-1));
    screenList.classList.add("leave-left");
    screenPlayer.classList.add("active");
    playCurrent();
  }
  function closePlayer(){
    screenPlayer.classList.remove("active");
    screenList.classList.remove("leave-left");
    stopAutoTimer(); stopRecording(true); destroyHls();
    video.removeAttribute("src"); video.load();
  }

  function destroyHls(){ if(hls){ try{hls.destroy();}catch(e){} hls=null; } }

  // channel chalane par sound ON; agar browser autoplay rok de to muted fallback
  function startPlayback(){
    video.muted = false;
    video.volume = 1;
    const btn = $("#volBtn");
    if(btn) btn.classList.toggle("on", video.muted);
    const p = video.play();
    if(p && p.catch){
      p.catch(()=>{
        video.muted = true;                       // sound ke saath autoplay block hua
        if(btn) btn.classList.toggle("on", true);
        const p2 = video.play();
        if(p2 && p2.catch) p2.catch(()=>{});
      });
    }
  }
  function playCurrent(){
    const c = channels[current];
    if(!c) return;
    $("#playerTitle").textContent = c.name || "PLUTO IPTV";
    $("#indexLabel").textContent = (current+1)+"/"+channels.length;
    $("#errBox").hidden = true;
    destroyHls(); stopAutoTimer();

    const url = c.url;
    const isHls = /\.m3u8(\?|#|$)/i.test(url) || /m3u8/i.test(url);

    if(isHls && window.Hls && window.Hls.isSupported()){
      hls = new window.Hls({ lowLatencyMode:true, enableWorker:true, backBufferLength:30 });
      hls.loadSource(url);
      hls.attachMedia(video);
      startPlayback();                                        // tap ke gesture me hi sound ke saath play
      hls.on(window.Hls.Events.MANIFEST_PARSED, ()=>{ startPlayback(); });
      hls.on(window.Hls.Events.ERROR, (_,data)=>{
        if(!data || !data.fatal) return;
        if(data.type===window.Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); }
        else if(data.type===window.Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
        else { showErr("Stream unavailable — trying next…"); setTimeout(nextChannel, 1200); }
      });
    }else{
      video.src = url;
      startPlayback();
      video.onerror = ()=>showErr("Cannot play this stream in the browser.");
    }
    scheduleAuto();
  }
  function showErr(msg){ const e=$("#errBox"); e.textContent=msg; e.hidden=false; }

  function nextChannel(){
    if(!channels.length) return;
    current = prefs.shuffle ? Math.floor(Math.random()*channels.length) : (current+1)%channels.length;
    playCurrent();
  }
  function prevChannel(){
    if(!channels.length) return;
    current = (current-1+channels.length)%channels.length;
    playCurrent();
  }

  /* ---------- auto-play one-by-one ---------- */
  function scheduleAuto(){
    stopAutoTimer();
    if(!prefs.auto) return;
    dwellTimer = setTimeout(nextChannel, Math.max(5,prefs.dwell)*1000);
  }
  function stopAutoTimer(){ if(dwellTimer){ clearTimeout(dwellTimer); dwellTimer=null; } }
  function setAuto(on){
    prefs.auto = on; save();
    $("#autoBtn").classList.toggle("on", on);
    $("#autoLabel").textContent = "Auto: " + (on?"On":"Off");
    if(on){ scheduleAuto(); toast("Auto-play on — every "+prefs.dwell+"s"); }
    else { stopAutoTimer(); toast("Auto-play off"); }
  }
  video.addEventListener("ended", ()=>{ if(prefs.auto) nextChannel(); });

  /* ---------- live data-speed readout ---------- */
  function currentKBs(){
    if(hls && hls.bandwidthEstimate) return hls.bandwidthEstimate/8/1024;       // bits/s -> KB/s
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if(c && c.downlink) return c.downlink*1000/8;                                // Mbps -> KB/s
    return null;
  }
  let speedSmoothed = null;
  setInterval(()=>{
    if(!screenPlayer.classList.contains("active")) return;
    const v = currentKBs();
    if(v==null){ $("#speedLabel").textContent = "— KB/S"; return; }
    speedSmoothed = speedSmoothed==null ? v : speedSmoothed*0.6 + v*0.4;
    const s = speedSmoothed;
    $("#speedLabel").textContent = (s>=1024 ? (s/1024).toFixed(1)+" MB/S" : Math.max(0,s).toFixed(0)+" KB/S");
  }, 1000);

  /* ---------- recording ---------- */
  function pickMime(){
    // MP4 pehle — phone ki gallery isko achhe se index karti hai
    const list=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
    for(const m of list) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return "";
  }
  function extFor(mime){ return /mp4/i.test(mime||"") ? ".mp4" : ".webm"; }
  // file ko seedha phone (Downloads) me bhej do — Android gallery isko dikhati hai
  function autoSaveToDevice(blob, name){
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name; a.rel="noopener"; a.style.display="none";
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 5000);
      return true;
    }catch(e){ return false; }
  }
  // gallery item ko phone ki Photos/Gallery me save karo (share sheet), warna download
  async function saveItemToPhone(item){
    try{
      let blob = item.blob;
      if(!blob) blob = await (await fetch(item.url)).blob();
      const type = blob.type || (item.kind==="image" ? "image/png" : "video/webm");
      const file = new File([blob], item.name, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:item.name });
        return;
      }
    }catch(e){ /* cancel ya unsupported */ }
    autoSaveToDevice(await (await fetch(item.url)).blob(), item.name);
  }
  function toggleRecord(){
    if(recording){ stopRecording(); return; }
    const stream = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
    if(!stream || !window.MediaRecorder){ toast("Recording not supported in this browser"); return; }
    if(!stream.getVideoTracks().length){ toast("Nothing to record yet — start a stream"); return; }
    const mime = pickMime();
    try{
      mediaRec = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    }catch(e){ toast("Recorder could not start"); return; }
    recChunks=[];
    mediaRec.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = ()=>{
      const type = (mediaRec && mediaRec.mimeType) || "video/webm";
      const blob = new Blob(recChunks, {type});
      const base = (channels[current] ? channels[current].name.replace(/[^\w\-]+/g,"_") : "channel") + "_" + Date.now();
      const name = base + extFor(type);
      gallery.unshift({ name, url:URL.createObjectURL(blob), kind:"video", at:Date.now(), size:blob.size, blob });
      // Gallery me dikha + seedha phone me bhi bhej do
      const ok = autoSaveToDevice(blob, name);
      toast(ok ? "Recording saved — Gallery + phone me ("+fmtSize(blob.size)+")" : "Recording saved to Gallery ("+fmtSize(blob.size)+")");
    };
    mediaRec.start(1000);
    recording=true; recStart=Date.now();
    $("#recBtn").classList.add("on");
    $("#recBadge").hidden=false;
    recTimer=setInterval(()=>{ $("#recTime").textContent = "REC "+fmtDur(Date.now()-recStart); },500);
    toast("Recording started");
  }
  function stopRecording(silent){
    if(!recording){ return; }
    recording=false;
    clearInterval(recTimer); recTimer=null;
    $("#recBtn").classList.remove("on");
    $("#recBadge").hidden=true;
    try{ mediaRec && mediaRec.state!=="inactive" && mediaRec.stop(); }catch(e){}
    if(!silent) toast("Recording stopped");
  }

  /* ---------- snapshot ---------- */
  function snapshot(){
    if(!video.videoWidth){ toast("No video frame yet"); return; }
    const cv=document.createElement("canvas");
    cv.width=video.videoWidth; cv.height=video.videoHeight;
    try{
      cv.getContext("2d").drawImage(video,0,0,cv.width,cv.height);
      cv.toBlob(b=>{
        if(!b){ toast("Snapshot blocked (cross-origin stream)"); return; }
        const name=(channels[current]?channels[current].name.replace(/[^\w\-]+/g,"_"):"channel")+"_"+Date.now()+".png";
        gallery.unshift({name,url:URL.createObjectURL(b),kind:"image",at:Date.now(),size:b.size,blob:b});
        toast("Snapshot saved to Gallery");
      },"image/png");
    }catch(e){ toast("Snapshot blocked by the stream's CORS policy"); }
  }

  }

    );
    $("#fAuto").addEventListener("click", ()=>{ setAuto(!prefs.auto); closeSheet(); });
    $("#fSnap").addEventListener("click", ()=>{ snapshot(); closeSheet(); });
    $("#fRec").addEventListener("click", ()=>{ toggleRecord(); closeSheet(); });
    $("#fGal").addEventListener("click", ()=>{ closeSheet(); openGallery(); });
    $("#fClose").addEventListener("click", closeSheet);
  }

  /* =========================================================
     wiring
     ========================================================= */
  // list header
  $("#plusBtn").addEventListener("click", ()=>openAddSheet("single"));
  $("#profileBtn").addEventListener("click", ()=>toast("Pluto IPTV · signed in"));
  $("#searchBtn").addEventListener("click", ()=>{
    const w=$("#searchWrap"); w.hidden=!w.hidden;
    if(!w.hidden){ $("#searchInput").focus(); } else { searchTerm=""; $("#searchInput").value=""; renderList(); }
  });
  $("#searchInput").addEventListener("input", e=>{ searchTerm=e.target.value; renderList(); });

  // bottom nav
  $$(".navitem").forEach(b=>b.addEventListener("click",()=>{
    const n=b.dataset.nav;
    if(n==="settings") openSettings();
    else if(n==="media") openGallery();
    else if(n==="fav"){   // Favourite button -> sirf favourite channels
      prefs.favOnly = !prefs.favOnly;
      save(); renderList();
      toast(prefs.favOnly ? "Favourite channels" : "All channels");
    }
    else {   // Device button -> list / grid view toggle (aur poore channels)
      prefs.favOnly = false;
      prefs.view = (prefs.view==="grid") ? "list" : "grid";
      save(); renderList();
      toast(prefs.view==="grid" ? "Grid view" : "List view");
    }
  }));

  // player
  $("#backBtn").addEventListener("click", closePlayer);
  $("#gearBtn").addEventListener("click", openSettings);
  $("#nextBtn").addEventListener("click", nextChannel);
  $("#prevBtn").addEventListener("click", prevChannel);
  $("#gridBtn").addEventListener("click", toggleGrid);
  $("#sdBtn").addEventListener("click", toggleQuality);
  $("#volBtn").addEventListener("click", e=>{ video.muted=!video.muted; e.currentTarget.classList.toggle("on", video.muted); });
  $("#snapBtn").addEventListener("click", snapshot);
  $("#recBtn").addEventListener("click", toggleRecord);
  // fullscreen me screen ko landscape kar do, taaki video poori screen bhare
  function lockLandscape(){
    try{
      if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{});
    }catch(e){}
  }
  function unlockOrientation(){
    try{
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }catch(e){}
  }
  $("#fsBtn").addEventListener("click", ()=>{
    const st=$("#stage");
    if(document.fullscreenElement){
      if(document.exitFullscreen) document.exitFullscreen();
      unlockOrientation();
    }else if(st.requestFullscreen){
      const pr = st.requestFullscreen();
      if(pr && pr.then) pr.then(lockLandscape).catch(()=>{});
      else lockLandscape();
    }
  });
  document.addEventListener("fullscreenchange", ()=>{
    if(document.fullscreenElement) lockLandscape();
    else unlockOrientation();
  });
  $("#autoBtn").addEventListener("click", ()=>setAuto(!prefs.auto));
  $("#featureBtn").addEventListener("click", openFeature);
  $("#galleryBtn").addEventListener("click", openGallery);
  // Playback button -> video play karta hai
  $("#playbackBtn").addEventListener("click", ()=>{
    const pr = video.play();
    if(pr && pr.catch) pr.catch(()=>{});
    $("#playbackBtn").classList.add("on");
    $("#micBtn").classList.remove("on");
    toast("Playing");
  });
  // MIC button -> video pause karta hai
  $("#micBtn").addEventListener("click", ()=>{
    try{ video.pause(); }catch(e){}
    $("#micBtn").classList.add("on");
    $("#playbackBtn").classList.remove("on");
    toast("Paused");
  });
  // video ke apne play/pause se button ka highlight sync rakho
  video.addEventListener("play", ()=>{ $("#playbackBtn").classList.add("on"); $("#micBtn").classList.remove("on"); });
  video.addEventListener("pause", ()=>{ $("#micBtn").classList.add("on"); $("#playbackBtn").classList.remove("on"); });

  document.addEventListener("keydown", e=>{
    if(!screenPlayer.classList.contains("active")) return;
    if(e.key==="Escape") closePlayer();
    if(e.key==="ArrowRight") nextChannel();
    if(e.key==="ArrowLeft") prevChannel();
    if(e.key===" "){ e.preventDefault(); video.paused?video.play():video.pause(); }
    if(e.key.toLowerCase()==="r") toggleRecord();
  });

  /* ---------------- splash screen ---------------- */
  setTimeout(()=>{
    const sp = $("#splash");
    if(sp){
      sp.classList.add("hide");
      setTimeout(()=>{ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 700);
    }
  }, 1000);

  /* ---------------- boot ---------------- */
  load();
  $("#autoBtn").classList.toggle("on", prefs.auto);
  $("#autoLabel").textContent = "Auto: "+(prefs.auto?"On":"Off");
  renderList();
})();
</script>
</body>
</html>
